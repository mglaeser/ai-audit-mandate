name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Catalogue, manifest and documentation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install pinned tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The prose is the source of truth. This fails if the generated catalogue,
      # check index or integrity manifest drifted from the volumes that define them.
      - name: Verify generated artifacts are current
        run: npm run verify

      # Anchors included. The obvious version of this check stops at `#` and
      # then reports success on a repository whose anchors are all broken.
      - name: Verify every internal link and anchor resolves
        run: npm run links

      # The version and the quoted mandate digest are written by hand in several
      # files at once, and `verify` cannot see either of them.
      - name: Verify release invariants
        run: npm run release

      - name: Validate the finding-record template against its schema
        run: npm run schema

      - name: Lint Markdown
        run: npm run lint

  scaffold:
    name: Engagement scaffolding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Scaffold a workspace into a scratch repository
        run: |
          scratch="$(mktemp -d)"
          node scripts/new-engagement.mjs --target "$scratch"
          printf 'ENGAGEMENT_SCRATCH=%s\n' "$scratch" >> "$GITHUB_ENV"

      # A fresh workspace must fail closed: every check unevidenced, production
      # refused. If this ever passes with production_eligible true, the default
      # state has stopped being safe.
      - name: Assert the fresh workspace fails closed
        run: |
          set -euo pipefail
          status="$ENGAGEMENT_SCRATCH/audit/engagement-status.json"
          findings="$ENGAGEMENT_SCRATCH/audit/03-findings.json"
          index="$ENGAGEMENT_SCRATCH/audit/00-check-catalogue.json"

          # Types, not just values: `jq -r` renders the string "false" and the
          # boolean false identically, so a stringified flag would pass silently.
          test "$(jq -r '.production_eligible | type' "$status")" = 'boolean'
          test "$(jq -r '.production_eligible' "$status")" = 'false'
          test "$(jq -r '.constitution_state' "$status")" = 'NOT_INSTANTIATED'
          test "$(jq -r '.registered_check_count | type' "$status")" = 'number'
          test "$(jq -r '.registered_check_count' "$status")" = '119'

          # Relations, not literals. §5 gates on the findings id-set equalling
          # the ACTIVE id-set, so assert exactly that rather than a constant that
          # has to be edited every time the catalogue grows.
          test "$(jq 'length' "$findings")" = "$(jq -r '.active_check_count' "$status")"
          test "$(jq -r '.present_check_count' "$status")" = "$(jq 'length' "$findings")"
          test "$(jq -S -r '[.[].id] | unique' "$findings")" = \
               "$(jq -S -r '[.checks[] | select(.state == "active") | .id] | unique' "$index")"
          test "$(jq '[.[] | select(.verdict != "NO-EVIDENCE")] | length' "$findings")" = '0'

          # Planned-extension scope must be registered, counted AND named (§5).
          test "$(jq -r '.checks | length' "$index")" = '119'
          test "$(jq -r '.pending_check_ids | length' "$status")" = \
               "$(( $(jq -r '.registered_check_count' "$status") - $(jq -r '.active_check_count' "$status") ))"

          # NO-EVIDENCE blocks as an open finding of its band, so the counters
          # must not read quiet while every record is unevidenced.
          test "$(jq -r '.highest_open_band' "$status")" != 'null'
          test "$(jq -r '.open_stop_ship_count' "$status")" != '0'

          # The engagement must be pinned to the mandate it ran under.
          test "$(jq -r '.mandate_manifest_hash' "$status")" = \
               "$(jq -r '.combined.sha256' mandate/manifest.json)"

          # An engagement opens at catalogue v1.0 while the catalogue defines
          # v2.0. Unifying the two would erase the active/registered distinction.
          test "$(jq -r '.catalogue_version' "$index")" = '1.0'
          test "$(jq -r '.catalogue_version' catalogue/checks.json)" = '2.0'

          # Pin the record key set to the committed template so the scaffolder
          # cannot quietly drop fields the §5 rules are written against.
          expected="$(jq -r 'del(."$schema", ._comment) | keys_unsorted | join(",")' templates/finding-record.json)"
          test "$(jq -r '.[0] | keys_unsorted | join(",")' "$findings")" = "$expected"
          test "$(jq -r '[.[] | keys_unsorted | join(",")] | unique | length' "$findings")" = '1'

      # The workspace is what a real engagement actually fills in, so its shape
      # is a contract. Nothing else in CI looks at it.
      - name: Validate the seeded findings against the §5 schema
        run: node scripts/check-finding-shape.mjs --file "$ENGAGEMENT_SCRATCH/audit/03-findings.json"

      - name: Assert the scaffolder refuses to overwrite an engagement in flight
        run: |
          if node scripts/new-engagement.mjs --target "$ENGAGEMENT_SCRATCH"; then
            echo 'Scaffolder overwrote an existing workspace; it must refuse.' >&2
            exit 1
          fi

      # --dir is the one argument that can write outside the workspace. "." and
      # ".." are the dangerous pair: basename() is identity on both.
      - name: Assert the scaffolder refuses a --dir that escapes the target
        run: |
          for bad in "" "." ".." "../escaped" "nested/path" "/abs" "a/../.."; do
            if node scripts/new-engagement.mjs --target "$ENGAGEMENT_SCRATCH" --dir "$bad" --force; then
              echo "Scaffolder accepted --dir '$bad'; it must refuse." >&2
              exit 1
            fi
          done

      # --force must not be a silent data-loss path once verdicts exist.
      - name: Assert --force refuses to discard recorded verdicts
        run: |
          set -euo pipefail
          findings="$ENGAGEMENT_SCRATCH/audit/03-findings.json"
          node -e 'const f=process.argv[1],a=require(f);a[0].verdict="FAIL";require("fs").writeFileSync(f,JSON.stringify(a,null,2))' "$findings"
          if node scripts/new-engagement.mjs --target "$ENGAGEMENT_SCRATCH" --force; then
            echo '--force discarded a recorded verdict without --discard-verdicts.' >&2
            exit 1
          fi
          test "$(jq '[.[] | select(.verdict != "NO-EVIDENCE")] | length' "$findings")" = '1'
          node scripts/new-engagement.mjs --target "$ENGAGEMENT_SCRATCH" --force --discard-verdicts
