name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Catalogue, manifest and documentation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install pinned tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The prose is the source of truth. This fails if the generated catalogue,
      # check index or integrity manifest drifted from the volumes that define them.
      - name: Verify generated artifacts are current
        run: npm run verify

      # Anchors included. The obvious version of this check stops at `#` and
      # then reports success on a repository whose anchors are all broken.
      - name: Verify every internal link and anchor resolves
        run: npm run links

      # The version and the quoted mandate digest are written by hand in several
      # files at once, and `verify` cannot see either of them.
      - name: Verify release invariants
        run: npm run release

      - name: Validate the finding-record template against its schema
        run: npm run schema

      - name: Lint Markdown
        run: npm run lint

  scaffold:
    name: Engagement scaffolding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Scaffold a workspace into a scratch repository
        run: |
          scratch="$(mktemp -d)"
          node scripts/new-engagement.mjs --target "$scratch"
          printf 'ENGAGEMENT_SCRATCH=%s\n' "$scratch" >> "$GITHUB_ENV"

      # A fresh workspace must fail closed: every check unevidenced, production
      # refused. If this ever passes with production_eligible true, the default
      # state has stopped being safe.
      - name: Assert the fresh workspace fails closed
        run: |
          status="$ENGAGEMENT_SCRATCH/audit/engagement-status.json"
          findings="$ENGAGEMENT_SCRATCH/audit/03-findings.json"

          test "$(jq -r '.production_eligible' "$status")" = 'false'
          test "$(jq -r '.constitution_state' "$status")" = 'NOT_INSTANTIATED'
          test "$(jq -r '.registered_check_count' "$status")" = '119'
          test "$(jq 'length' "$findings")" = '119'
          test "$(jq '[.[] | select(.verdict != "NO-EVIDENCE")] | length' "$findings")" = '0'
          test "$(jq -r '[.[].id] | unique | length' "$findings")" = '119'

      # The workspace is what a real engagement actually fills in, so its shape
      # is a contract. Nothing else in CI looks at it.
      - name: Validate the seeded findings against the §5 schema
        run: node scripts/check-finding-shape.mjs --file "$ENGAGEMENT_SCRATCH/audit/03-findings.json"

      - name: Assert the scaffolder refuses to overwrite an engagement in flight
        run: |
          if node scripts/new-engagement.mjs --target "$ENGAGEMENT_SCRATCH"; then
            echo 'Scaffolder overwrote an existing workspace; it must refuse.' >&2
            exit 1
          fi

      # --dir is the one argument that can write outside the workspace.
      - name: Assert the scaffolder refuses a --dir that escapes the target
        run: |
          for bad in "" "../escaped" "nested/path"; do
            if node scripts/new-engagement.mjs --target "$ENGAGEMENT_SCRATCH" --dir "$bad" --force; then
              echo "Scaffolder accepted --dir '$bad'; it must refuse." >&2
              exit 1
            fi
          done
